[package]
name = "farthinder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "fart"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
askama = "0.16.0"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
fastcert = "0.3.1"
figment = { version = "0.10.19", features = ["toml", "yaml", "json", "env"] }
flate2 = "1.1.9"
http = "1.4.0"
http-body-util = "0.1.3"
hyper = "1.9.0"
hyper-util = { version = "0.1.20", features = ["client", "client-proxy", "http1", "server", "tokio"] }
insta = { version = "1.47.2", features = ["json"] }
jiff = "0.2.24"
rcgen = "0.14.8"
rich_rust = "0.2.1"
rustls = { version = "0.23.40", features = ["aws_lc_rs", "tls12"] }
rustls-native-certs = "0.8.3"
rustls-pemfile = "2.2.0"
serde = { version = "1.0.228", features = ["derive"] }
serde-ignored-fields = { version = "0.1.1", features = ["serde_json"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt", "rt-multi-thread"] }
tokio-rustls = "0.26.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
insta = "1.47.2"
