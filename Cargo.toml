[package]
name = "farthinder"
version = "0.0.1-alpha.1"
edition = "2024"

[[bin]]
name = "fart"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
askama = "0.16.0"
clap = { version = "4.6.1", features = ["derive"] }
directories = "6.0.0"
figment = { version = "0.10.19", features = ["toml", "yaml", "json", "env"] }
http = "1.4.0"
http-body-util = "0.1.3"
hyper = "1.9.0"
hyper-util = { version = "0.1.20", features = ["client", "client-proxy", "http1", "server", "tokio"] }
jiff = "0.2.24"
rcgen = "0.14.8"
rich_rust = "0.2.1"
rustls = { version = "0.23.40", default-features = false, features = ["std", "logging", "ring", "tls12", "brotli"] }
rustls-native-certs = "0.8.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1.52.3", features = ["io-util", "macros", "net", "rt", "rt-multi-thread"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "ring", "tls12", "brotli"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
urlencoding = "2.1.3"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.4"
libc = "0.2.186"
seccompiler = "0.5.0"

[profile.release]
strip = true
lto = true
codegen-units = 1

[dev-dependencies]
insta = { version = "1.47.2", features = ["json"] }
test-case = "3.3.1"
